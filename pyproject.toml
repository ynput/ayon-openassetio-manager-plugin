[project]
name = "ayon-openassetio-manager-plugin"
version = "0.2.0"
requires-python = ">=3.10,<3.12"
authors = [
    { name="AYON Team", email = "info@ynput.io" }
]
description = "AYON Manager Plugin for OpenAssetIO hosts."
keywords = ["AYON", "OpenAssetIO", "asset", "automation", "tracking", "asset management"]
readme = "README.md"
homepage = "https://github.com/ynput/ayon-openassetio-manager-plugin"
license = "Apache License 2.0"

# Using unlocked version until everything stabilizes
dependencies = [
    "ayon-python-api",
    # ~/.local/share/AYON/addons/core_1.3.2 - dependencies not available
    # in dependency_packages:
    "platformdirs",
    "semver",
    "arrow",
    "attrs"
]

[project.optional-dependencies]
# For UI delegates. Assumes PySide/PyQt is already available in the Python
# environment.
ui = [
    "qtpy",
    "qtawesome==0.7.3"
]
# For cases where OpenAssetIO is not already available in the Python
# environment, which should be rare, e.g. unit tests.
openassetio = [
    "openassetio>=1.0.0rc2",
    "openassetio-mediacreation>=1.0.0a12",
]

[project.urls]
repository = "https://github.com/ynput/ayon-openassetio-manager-plugin"

[project.entry-points."openassetio.manager_plugin"]
plugin_package_or_module = "ayon_openassetio_manager"

[project.entry-points."openassetio.ui_plugin"]
plugin_package_or_module = "ayon_openassetio_manager.ui"

[tool.black]
line-length = 99

[tool.ruff]
line-length = 99

[tool.setuptools]
package-dir = {"" = "plugin"}

[tool.setuptools.packages]
find = {}

[tool.poetry]
name = "ayon-openassetio-manager-plugin"
version = "0.2.0"
description = "AYON Manager Plugin for OpenAssetIO hosts."
authors = ["AYON Team <info@ynput.io>"]
license = "Apache-2.0"
homepage = "https://github.com/ynput/ayon-openassetio-manager-plugin"
repository = "https://github.com/ynput/ayon-openassetio-manager-plugin"
readme = "README.md"
keywords = ["AYON", "OpenAssetIO", "asset", "automation", "tracking", "asset management"]
packages = [
    {include = "ayon_openassetio_manager", from = "plugin"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
ayon-python-api = "*"
platformdirs = "*"
semver = "*"
arrow = "*"
attrs = "*"

[tool.poetry.extras]
ui = ["qtpy", "qtawesome"]
openassetio = ["openassetio", "openassetio-mediacreation"]

[tool.poetry.group.dev.dependencies]
openassetio-traitgen = "*"
flake8 = "*"
mypy = "*"
isort = "*"
ruff = "*"

[tool.poetry.group.test.dependencies]
pytest = "*"
pytest-print = "*"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/ynput/ayon-openassetio-manager-plugin/issues"
"Discussions" = "https://community.ynput.io/"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[manager]
identifier = "io.ynput.ayon.openassetio.manager"